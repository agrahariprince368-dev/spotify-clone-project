<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"href="style.css">
</head>
<body>
         <main class="weather-card">
            <header class="header">
                <div class="search">
                    <label for="search"></label>
                    <input type="text" id="search" placeholder=" search city.."name="sear">
                    </div>
                    <div class="searchbtn">
                    <button id="searchbtn">Search</button>
                </div>
        </header>
                    <div  class="weather-info">
                        <img id="weatherimage" src="wheather.jpeg"alt="wheather" height="200px" width="200px"> 
                        <h1 id="temp">32&deg;<sup>C</sup></h1> 
                        <h2 id="cityname">Kanpur</h2>
                    <p id="description">clear sky</p>
                 </div>
            <footer class="weather-details">
                <div class="info">Humidity</div>
                <div class="info">Wind Speed</div>
                <div class="info">Feels Like</div>
            </footer>
            </main>
</body>
</html>
